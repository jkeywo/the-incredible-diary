name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Cache pinned Godot tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: godot-linux-${{ hashFiles('.godot-version', 'tools/setup-godot.py') }}
      - name: Install Godot and export templates
        run: python tools/setup-godot.py
      - name: Import project
        run: .tools/godot/godot --headless --path . --editor --import
      - name: Run authoring probe checks
        run: |
          mkdir -p build/web build/windows
          .tools/godot/godot --headless --path . res://main.tscn -- --probe-test --save-path="$PWD/build/probe-save.json" --report="$PWD/build/probe-results.json"
          python -c "import json; assert json.load(open('build/probe-results.json'))['passed']"
          .tools/godot/godot --headless --path . --script res://tests/foundation_test.gd
      - name: Test Mission 1
        run: |
          for suite in pocket_watch mission1_rooms mission1_chandelier mission1_steam mission1_route mission1_walking mission1_save mission1_play; do
            .tools/godot/godot --headless --path . --script "res://tests/${suite}_test.gd" --quit-after 300 > "build/${suite}.log" 2>&1
            cat "build/${suite}.log"
            python -c 'import pathlib,sys; t=pathlib.Path(sys.argv[1]).read_text(); assert "SCRIPT ERROR" not in t and "Assertion failed" not in t and ("PASS" in t or "\"passed\":true" in t)' "build/${suite}.log"
          done
      - name: Record and reload a full simulated leg
        run: |
          .tools/godot/godot --headless --path . res://foundation/harness.tscn -- --foundation-benchmark --benchmark-save-path="$PWD/build/foundation-benchmark.jsonl" --benchmark-report="$PWD/build/foundation-benchmark-result.json"
          python -c "import json; r=json.load(open('build/foundation-benchmark-result.json')); assert r['passed'] and r['ticks'] == 10800"
      - name: Export Web and Windows
        run: |
          .tools/godot/godot --headless --path . --export-release Web build/web/index.html
          .tools/godot/godot --headless --path . --export-release Windows build/windows/Amelia.exe
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/windows/Amelia.exe
          touch build/web/.nojekyll
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: amelia-windows
          path: build/windows/
          if-no-files-found: error
      - name: Upload Pages build
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
